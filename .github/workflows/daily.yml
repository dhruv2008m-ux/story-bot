# Put this file in your repo at:  .github/workflows/daily.yml
name: Daily videos

on:
  schedule:
    - cron: "30 0 * * *"      # every day 6:00 AM India time
  workflow_dispatch:           # also lets you press "Run workflow" by hand

permissions:
  contents: write              # to save story history (avoids repeated stories)

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false         # if one channel fails, others still run
      matrix:
        channel: [kids_en, kids_hi, village_hi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - run: python story_video_bot_v3.py ${{ matrix.channel }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.channel }}
          path: |
            output/*/${{ matrix.channel }}/video.mp4
            output/*/${{ matrix.channel }}/short.mp4
            output/*/${{ matrix.channel }}/thumbnail.jpg
            output/*/${{ matrix.channel }}/info.txt
          retention-days: 2
      - name: Save history
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add history_*.json || true
          git commit -m "history ${{ matrix.channel }}" || exit 0
          for i in 1 2 3 4; do git pull --rebase && git push && break || sleep 8; done
